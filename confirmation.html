<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier Orme | Commande validee</title>
    <meta
      name="description"
      content="Retrouvez le recapitulatif de votre commande."
    />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body data-page="confirmation">
    <div class="page-shell">
      <header class="catalog-header">
        <a class="catalog-header__brand" href="index.html">Atelier Orme</a>
        <a href="cart.html" class="catalog-header__cart">
          <span>Panier</span>
          <span class="cart-chip__count" data-cart-count hidden>0</span>
        </a>
      </header>

      <main class="page-main confirmation-page-main">
        <section class="confirmation-page-head">
          <h1>Commande validee</h1>
          <p>Votre commande a bien ete prise en compte.</p>
        </section>

        <section class="confirmation-stage" data-confirmation-stage>
          <div class="page-status">Chargement de la commande...</div>
        </section>
      </main>

      <footer class="site-footer">
        <p>Projet e-commerce scolaire</p>
        <p>&copy; <span data-current-year></span> Atelier Orme</p>
      </footer>
    </div>

    <script type="module" src="scripts/confirmation.js"></script>
  </body>
</html>
