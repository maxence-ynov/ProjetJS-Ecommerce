<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier Orme | Produit</title>
    <meta
      name="description"
      content="Consultez un produit et choisissez une finition."
    />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body data-page="product">
    <div class="page-shell">
      <header class="catalog-header">
        <a class="catalog-header__brand" href="index.html">Atelier Orme</a>
        <a href="cart.html" class="catalog-header__cart">
          <span>Panier</span>
          <span class="cart-chip__count" data-cart-count hidden>0</span>
        </a>
      </header>

      <main class="page-main">
        <section class="product-page-head">
          <a class="text-link" href="index.html#catalogue">Retour aux produits</a>
        </section>

        <div class="page-status" data-product-status>Chargement du produit...</div>
        <section class="product-stage" data-product-stage hidden></section>
      </main>

      <footer class="site-footer">
        <p>Projet e-commerce scolaire</p>
        <p>&copy; <span data-current-year></span> Atelier Orme</p>
      </footer>
    </div>

    <script type="module" src="scripts/product.js"></script>
  </body>
</html>
